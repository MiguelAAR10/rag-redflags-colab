[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agentic-harness"
version = "0.1.0"
description = "RAG agentic harness starter"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pytest",
  "httpx",
  "jinja2",
  "python-multipart",
  "pydantic",
  "pydantic-settings",
  "sqlmodel",
  "google-genai",
  "qdrant-client",
  "python-docx",
  "numpy",
  "faiss-cpu",
  "pymupdf"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx"
]
neural = [
  "sentence-transformers",
  "rank-bm25"
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages"]
pythonpath = ["apps/api", "apps/api/app", "."]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps.api.app*"]
namespaces = true
